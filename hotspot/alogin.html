<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WiFi Zone Interplus - Conectado</title>
  <meta http-equiv="refresh" content="0;url=$(link-status)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <style>
    :root {
      --color-1: #4667A0;
      --color-2: #0097BD;
      --color-success: #4CAF50;
      --color-danger: #dc3545;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--color-1), var(--color-2));
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 12px;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px 16px;
    }
    .logo {
      width: 180px;
      max-width: 90%;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.18));
    }
    h1 {
      font-size: 1.6em;
      margin: 0 0 8px;
      text-shadow: 0 3px 12px rgba(0,0,0,0.18);
    }
    p { margin: 0 0 20px; opacity: 0.95; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      color: #fff;
    }
    .btn-status { background: var(--color-success); }
    .btn-logout { background: var(--color-danger); }
    .btn-nav {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.45);
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="img/logo_blanco1.svg" alt="Logo Interplus">
    <h1>Conectado</h1>
    <p>$(if username)Entraste como <b>$(username)</b>.$(endif) Abrí el estado de tu conexión para ver el tiempo y cerrar sesión. Después, en el navegador: <b>wifi.interplus</b>.</p>
    <div class="actions">
      <a class="btn-status" href="$(link-status)">Ver estado de la conexión</a>
      <a class="btn-logout" href="$(link-logout)" onclick="return confirm('¿Cerrar la sesión de Wi-Fi Zone?');">Cerrar sesión</a>
      <a class="btn-nav" href="$(link-redirect)">Seguir navegando</a>
    </div>
  </div>
  <script>
    window.location.replace('$(link-status)');
  </script>
</body>
</html>
