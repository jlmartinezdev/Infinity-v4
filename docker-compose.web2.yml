# Segundo servidor web en IP propia (puerto 80 libre, sin pelear con XAMPP).
#
# En el host debe existir 10.200.1.3/28 en Ethernet (skipassource).
# Apache de XAMPP escucha solo 10.200.1.2:80.
#
#   docker compose -f docker-compose.web2.yml up -d
#   http://10.200.1.2/   → Infinity (XAMPP)
#   http://10.200.1.3/   → este nginx
#
# Sitio: docker/web2/html

services:
  web2:
    image: nginx:1.27-alpine
    container_name: infinity-web2
    restart: unless-stopped
    ports:
      - "10.200.1.3:80:80"
    volumes:
      - ./docker/web2/html:/usr/share/nginx/html:ro
      - ./docker/web2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
